name: "Build Ruby Kernel - MoonWake Core"

env:
  OUT_DIR: "${{ github.workspace }}/out"

on:
  workflow_dispatch:
    inputs:
      config_type:
        description: "Tipo de configuración (folder en configs/)"
        required: true
        type: choice
        default: "nightly"
        options:
          - release
          - nightly

permissions:
  contents: write

jobs:
  Set-repos:
    name: "Cargar Configuración Matrix"
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Generar Matrix desde JSON"
        id: generate-matrix
        run: |
          CONFIG_TYPE="${{ github.event.inputs.config_type }}"
          FILES=$(find "configs/$CONFIG_TYPE" -type f -name "*.json")
          if [ -z "$FILES" ]; then echo "No se encontraron archivos JSON"; exit 1; fi
          repos_json="[]"
          for process_file in $FILES; do
            sed -i '1s/^\xEF\xBB\xBF//' "$process_file"
            repos_json=$(jq -s 'add' <(echo "$repos_json") "$process_file")
          done
          echo "repos=$repos_json" >> $GITHUB_OUTPUT

  Build-Kernel:
    name: "Compilar Kernel"
    runs-on: ubuntu-22.04
    needs: Set-repos
    strategy:
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    
    env:
      KERNEL_NAME: ${{ matrix.repos.kernelSource.name }}
      KERNEL_REPO: ${{ matrix.repos.kernelSource.repo }}
      KERNEL_BRANCH: ${{ matrix.repos.kernelSource.branch }}
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: "Instalar dependencias"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev aria2 curl git ccache python3 zip unzip libelf-dev libncursesw5-dev device-tree-compiler jq

      - name: "Clonar Código Fuente"
        run: |
          git clone --recursive --depth=1 --branch ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }}
          git clone --recursive --depth=1 --branch ${{ matrix.repos.AnyKernel3.branch }} ${{ matrix.repos.AnyKernel3.repo }} AnyKernel3

      - name: "Descargar Toolchains"
        env:
          toolchains: "${{ toJSON(matrix.repos.toolchains) }}"
        run: |
          toolchains_num=$(echo $toolchains | jq 'length')
          for ((i=0;i<toolchains_num;i++)); do
            tc_name=$(echo $toolchains | jq -r ".[$i].name")
            tc_url=$(echo $toolchains | jq -r ".[$i].url")
            aria2c -x 16 -s 16 "$tc_url"
            filename="${tc_url##*/}"
            mkdir -p "$tc_name"
            if [[ "$filename" == *.zip ]]; then unzip -q "$filename" -d "$tc_name"; else tar xf "$filename" -C "$tc_name"; fi
            jq -r ".[$i].binPath[]" <<< "$toolchains" | while read -r bin_p; do
              echo "$WORKSPACE/$tc_name/$bin_p" >> $GITHUB_PATH
            done
          done

      - name: "Integrar KernelSU-Next"
        if: ${{ matrix.repos.kernelsu.enable == 'true' }}
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          curl -LSs "${{ matrix.repos.kernelsu.setupLink }}" | bash -s ${{ matrix.repos.kernelsu.setupArg }}

      - name: "Configuración Pro-Droidspaces"
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          # Asegurar que el directorio de configs existe
          mkdir -p arch/arm64/configs/
          DEFCONFIG_PATH="arch/arm64/configs/${{ matrix.repos.kernelSource.defconfig }}"
          
          # Si el defconfig no está en la raíz de configs, lo buscamos
          if [ ! -f "$DEFCONFIG_PATH" ]; then
            DEFCONFIG_PATH=$(find arch/arm64/configs/ -name "${{ matrix.repos.kernelSource.defconfig }}" | head -n 1)
          fi

          cat <<EOF >> "$DEFCONFIG_PATH"
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_MEMCG=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          EOF

      - name: "Compilar Kernel"
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          # Argumentos base
          ARGS="ARCH=${{ matrix.repos.params.ARCH }} O=${{ env.OUT_DIR }} CC=${{ matrix.repos.params.CC }}"
          
          # Extraer comandos adicionales del JSON de forma segura
          EXT_ARGS=$(echo '${{ toJSON(matrix.repos.params.externalCommand) }}' | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' | xargs)
          
          echo "Haciendo defconfig..."
          make $ARGS $EXT_ARGS ${{ matrix.repos.kernelSource.defconfig }}
          
          # Aplicar fragmentos extra si existen
          for extra in ${{ matrix.repos.kernelSource.extraConfig }}; do
             make $ARGS $EXT_ARGS $extra || true
          done
          
          echo "Iniciando compilación principal..."
          make -j$(nproc --all) $ARGS $EXT_ARGS ${{ matrix.repos.params.build_out }}

      - name: "Empaquetar"
        run: |
          cp -f ${{ env.OUT_DIR }}/arch/${{ matrix.repos.params.ARCH }}/boot/${{ matrix.repos.output_image }} ./AnyKernel3/
          cd AnyKernel3
          zip -r ../MoonWake-Ruby-Droidspaces.zip . -x .git README.md

      - name: "Subir Artefacto"
        uses: actions/upload-artifact@v4
        with:
          name: MoonWake-Ruby-Aeron
          path: MoonWake-Ruby-Droidspaces.zip