name: "Build Ruby Kernel - MoonWake Core"

env:
  OUT_DIR: "${{ github.workspace }}/out"

on:
  workflow_dispatch:
    inputs:
      config_type:
        description: "Tipo de configuración (folder en configs/)"
        required: true
        type: choice
        default: "nightly"
        options:
          - release
          - nightly

permissions:
  contents: write

jobs:
  Set-repos:
    name: "Cargar Configuración Matrix"
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Generar Matrix desde JSON"
        id: generate-matrix
        run: |
          CONFIG_TYPE="${{ github.event.inputs.config_type }}"
          FILES=$(find "configs/$CONFIG_TYPE" -type f -name "*.json")
          if [ -z "$FILES" ]; then echo "No se encontraron archivos JSON"; exit 1; fi
          
          # Generar JSON compacto para evitar errores de formato en GITHUB_OUTPUT
          repos_json=$(jq -c -s 'add' $FILES)
          echo "repos=$repos_json" >> "$GITHUB_OUTPUT"

  Build-Kernel:
    name: "Compilar Kernel"
    runs-on: ubuntu-22.04
    needs: Set-repos
    strategy:
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    
    env:
      KERNEL_NAME: ${{ matrix.repos.kernelSource.name }}
      KERNEL_REPO: ${{ matrix.repos.kernelSource.repo }}
      KERNEL_BRANCH: ${{ matrix.repos.kernelSource.branch }}
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: "Instalar dependencias"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev aria2 curl git ccache python3 zip unzip libelf-dev libncursesw5-dev device-tree-compiler jq

      - name: "Clonar Código Fuente y AnyKernel3"
        run: |
          # Validar AnyKernel3 antes de clonar
          AK3_REPO="${{ matrix.repos.AnyKernel3.repo }}"
          AK3_BRANCH="${{ matrix.repos.AnyKernel3.branch }}"
          if [ -z "$AK3_REPO" ] || [ "$AK3_REPO" == "null" ]; then echo "ERROR: AnyKernel3.repo no definido"; exit 1; fi
          
          git clone --recursive --depth=1 --branch $KERNEL_BRANCH $KERNEL_REPO $KERNEL_NAME
          git clone --recursive --depth=1 --branch $AK3_BRANCH $AK3_REPO AnyKernel3

      - name: "Descargar Toolchains"
        env:
          toolchains: "${{ toJSON(matrix.repos.toolchains) }}"
        run: |
          set -euo pipefail
          toolchains_num=$(echo "$toolchains" | jq 'length')
          
          for ((i=0;i<toolchains_num;i++)); do
            tc_name=$(echo "$toolchains" | jq -r ".[$i].name // \"tc_$i\"")
            tc_url=$(echo "$toolchains" | jq -r ".[$i].url // empty")

            if [ -z "$tc_url" ] || [ "$tc_url" == "null" ]; then
              echo "ERROR: La URL del toolchain '$tc_name' es nula o inválida en el JSON."
              exit 1
            fi

            echo "Descargando: $tc_name desde $tc_url"
            aria2c -x 16 -s 16 "$tc_url"
            filename="${tc_url##*/}"
            
            mkdir -p "$tc_name"
            if [[ "$filename" == *.zip ]]; then unzip -q "$filename" -d "$tc_name"; else tar xf "$filename" -C "$tc_name"; fi
            
            # Validar binPath
            jq -r ".[$i].binPath[]?" <<< "$toolchains" | while read -r bin_p; do
              if [ -n "$bin_p" ] && [ "$bin_p" != "null" ]; then
                echo "$WORKSPACE/$tc_name/$bin_p" >> $GITHUB_PATH
              fi
            done
          done

      - name: "Integrar KernelSU-Next"
        if: ${{ matrix.repos.kernelsu.enable == 'true' }}
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          curl -LSs "${{ matrix.repos.kernelsu.setupLink }}" | bash -s ${{ matrix.repos.kernelsu.setupArg }}

      - name: "Configuración Pro-Droidspaces"
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          DEFCONFIG="${{ matrix.repos.kernelSource.defconfig }}"
          DEFCONFIG_PATH=$(find arch/arm64/configs/ -name "$DEFCONFIG" | head -n 1)
          
          if [ -z "$DEFCONFIG_PATH" ] || [ ! -f "$DEFCONFIG_PATH" ]; then
            echo "ERROR: No se encontró el defconfig: $DEFCONFIG"
            exit 1
          fi

          echo "Aplicando flags de Droidspaces a $DEFCONFIG_PATH"
          cat <<EOF >> "$DEFCONFIG_PATH"
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_MEMCG=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          EOF

      - name: "Compilar Kernel"
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          ARGS="ARCH=${{ matrix.repos.params.ARCH }} O=${{ env.OUT_DIR }} CC=${{ matrix.repos.params.CC }}"
          EXT_ARGS=$(echo '${{ toJSON(matrix.repos.params.externalCommand) }}' | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' | xargs)
          
          make $ARGS $EXT_ARGS ${{ matrix.repos.kernelSource.defconfig }}
          
          # Manejar extraConfig de forma segura (soporta string o array)
          EXTRAS=$(echo '${{ toJSON(matrix.repos.kernelSource.extraConfig) }}' | jq -r 'if type=="array" then .[] else . end')
          for extra in $EXTRAS; do
             [ -n "$extra" ] && [ "$extra" != "null" ] && make $ARGS $EXT_ARGS $extra || true
          done
          
          make -j$(nproc --all) $ARGS $EXT_ARGS ${{ matrix.repos.params.build_out }}

      - name: "Verificar y Empaquetar"
        run: |
          IMAGE_PATH="${{ env.OUT_DIR }}/arch/${{ matrix.repos.params.ARCH }}/boot/${{ matrix.repos.output_image }}"
          if [ ! -f "$IMAGE_PATH" ]; then
            echo "ERROR: El kernel compilado no existe en $IMAGE_PATH"
            ls -R ${{ env.OUT_DIR }}/arch/${{ matrix.repos.params.ARCH }}/boot/ || true
            exit 1
          fi
          
          cp -f "$IMAGE_PATH" ./AnyKernel3/
          cd AnyKernel3
          zip -r ../MoonWake-Ruby-Aeron.zip . -x .git README.md

      - name: "Subir Artefacto"
        uses: actions/upload-artifact@v4
        with:
          name: MoonWake-Ruby-Aeron
          path: MoonWake-Ruby-Aeron.zip